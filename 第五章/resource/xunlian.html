<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>修仙人物资料表</title>
    <style>
        table { border-collapse: collapse; }
        th, td { border: 1px solid #ccc; padding: 8px 12px; }
        th { background: #eef3f8; }
    </style>
</head>
<body>
    <h1>修仙人物资料表</h1>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>姓名</th>
                    <th>性别</th>
                    <th>头像</th>
                    <th>修为</th>
                    <th>技能</th>
                    <th>身份地位</th>
                    <th>师承</th>
                    <th>法宝</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>沈青舟</td>
                    <td>男</td>
                    <td><img src="images/shen-qingzhou.png" alt="沈青舟" width="60"></td>
                    <td>筑基后期</td>
                    <td>御剑术、踏云步</td>
                    <td>青云宗内门弟子</td>
                    <td>玄松真人</td>
                    <td>听风剑</td>
                </tr>
                <tr>
                    <td>顾明月</td>
                    <td>女</td>
                    <td><img src="images/gu-mingyue.png" alt="顾明月" width="60"></td>
                    <td>金丹初期</td>
                    <td>回春诀、炼丹术</td>
                    <td>药王谷长老</td>
                    <td>白芷仙子</td>
                    <td>青玉药鼎</td>
                </tr>
                <tr>
                    <td>陆长川</td>
                    <td>男</td>
                    <td><img src="images/lu-changchuan.png" alt="陆长川" width="60"></td>
                    <td>元婴中期</td>
                    <td>引雷诀、护山阵</td>
                    <td>天雷峰峰主</td>
                    <td>赤霄道人</td>
                    <td>九霄雷印</td>
                </tr>
            </tbody>
        </table>
    </div>

    <p class = "str">以上是三位修仙人物的资料。</p>
    <p id = "nihao">你好，我爱中国</p>
    <p id = "nihao2">你好2，我爱中国2</p>
    <img src="images/lu-changchuan.png" alt="陆长川" width="60">
</body>
</html>
